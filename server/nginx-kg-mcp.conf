# =============================================================================
# 总知识图谱 ARGO MCP HTTP/SSE 网关 - Nginx 反向代理配置
#
# 将远程服务器的 ARGO MCP HTTP/SSE 网关暴露为公网 HTTPS 端点，供各项目
# 通过 MCP over HTTP/SSE 获取/贡献总知识图谱。
#
# 安装: 放入 /etc/nginx/sites-available/kg-mcp 并软链到 sites-enabled，
#       或参考 server/deploy-remote.sh 自动部署。
#
# 依赖: 网关服务监听 127.0.0.1:18789 (systemd: argo-mcp-gateway)
# =============================================================================

# --- 80 端口 HTTP (跳转或直接服务) ---
server {
    listen 80;
    server_name argo.derekworkspacev5.com;

    # 推荐: 生产环境跳转 HTTPS（需配置证书）
    # return 301 https://$host$request_uri;

    location /mcp {
        proxy_pass http://127.0.0.1:18789/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (text/event-stream) 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection '';
    }

    location /health {
        proxy_pass http://127.0.0.1:18789/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:18789/;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/kg-mcp_access.log;
    error_log /var/log/nginx/kg-mcp_error.log;
}

