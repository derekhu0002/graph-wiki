# =============================================================================
# 总知识图谱 ARGO MCP HTTP/SSE 网关 - Nginx 反向代理配置
#
# 已在服务器 argo.derekworkspacev5.com 站点配置中合并（含 /insight/、/shopping/
# 等已有服务）。本文件保留模板供重建/迁移使用。
#
# 网关服务监听 127.0.0.1:18792 (systemd: argo-mcp-gateway)
# 公网端点: https://argo.derekworkspacev5.com/mcp (Cloudflare HTTPS 回源)
# =============================================================================

# --- 主站点 server 块（合并进 argo.derekworkspacev5.com 现有配置）---
server {
    listen 80;
    listen 443 ssl;
    server_name argo.derekworkspacev5.com;
    root /var/www/test.derekworkspacev5.com;
    index index.html;

    ssl_certificate /etc/nginx/ssl/argo-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/argo-selfsigned.key;

    # --- /insight/ reverse proxy: agentic 8-theme insight site ---
    location /insight/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- /shopping/ static landing: book-list landing page ---
    location /shopping/ {
        alias /opt/shopping/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # --- /mcp ARGO 总知识图谱 HTTP/SSE 网关 ---
    location /mcp {
        proxy_pass http://127.0.0.1:18792/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (text/event-stream) 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection '';
    }

    # --- /health 网关健康检查 ---
    location /health {
        proxy_pass http://127.0.0.1:18792/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/argo.derekworkspacev5.com_access.log;
    error_log /var/log/nginx/argo.derekworkspacev5.com_error.log;
}
